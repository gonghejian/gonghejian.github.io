name: Macro Daily Lab

on:
  workflow_dispatch:
  schedule:
    # 07:30 China time
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: macro-daily-lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Generate macro daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python labs/macro-daily-lab/generate_report.py

      - name: Commit report updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(macro-daily): update daily report"
          file_pattern: |
            labs/macro-daily-lab/data.json
            labs/macro-daily-lab/reports/*.html
