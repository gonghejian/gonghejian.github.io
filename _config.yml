# Jekyll配置
title: "弓箭的博客"
description: "记录思考、分享知识、探索世界"
author: "Your Name"
email: "your.email@example.com"
url: "https://gonghejian.cn"
baseurl: ""

# 语言设置
lang: zh-CN
locale: zh_CN
encoding: utf-8

# 构建设置
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
future: true  # 显示未来日期的文章

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  # jekyll-compress-html 插件已移除（RubyGems 上不可用）

# 分页
paginate: 10
paginate_path: "/page:num/"

# 主题设置
theme: null

# 导航菜单
navigation:
  - title: 首页
    url: /
  - title: 分类
    url: /categories/
  - title: 归档
    url: /archive/
  - title: 关于
    url: /about/

# 社交媒体
# 配置说明：
# 1. 知乎：访问 https://www.zhihu.com/people/你的用户名，复制完整链接
# 2. 小红书：访问你的小红书主页，复制完整链接（格式：https://www.xiaohongshu.com/user/profile/你的ID）
# 3. 豆瓣：访问 https://www.douban.com/people/你的用户名，复制完整链接
# 4. 微信公众号：可以是公众号主页链接，或二维码图片链接
# 如果不需要某个平台，可以删除该行或留空
social:
  github: yourusername
  twitter: yourusername
  email: your.email@example.com
  zhihu: https://www.zhihu.com/people/your-username  # 知乎个人主页链接（必填完整URL）
  xiaohongshu: https://www.xiaohongshu.com/user/profile/your-id  # 小红书个人主页链接（必填完整URL）
  douban: https://www.douban.com/people/your-username  # 豆瓣个人主页链接（必填完整URL）
  wechat: https://mp.weixin.qq.com/your-account  # 微信公众号链接或二维码图片链接
  wechat_private: https://your-qrcode-link.com  # 私人微信二维码图片链接（可选，如果配置了会显示为链接按钮）
  wechat_id: your-wechat-id  # 私人微信号（可选，如果配置了点击按钮会复制微信号）

# 评论系统配置
# 可选值: utterances, gitalk, custom
# custom: 支持匿名评论，使用 localStorage 存储（仅用于演示）
comments:
  provider: custom  # 改为 custom 启用匿名评论功能
  utterances:
    repo: yourusername/your-repo-name  # 修改为你的GitHub仓库
    issue_term: pathname
    theme: github-light

# 认证系统配置已移除

# 主页分类配置（参考少数派风格）
# 注意：slug 必须与文章中的 categories 字段匹配
home_categories:
  - name: 阅读笔记
    slug: reading
    icon: 📚
    description: 读书笔记和读后感，分享阅读心得和思考
  - name: 生活方式
    slug: lifestyle
    icon: 🌟
    description: 生活感悟、日常思考和个人成长
  - name: 效率工具
    slug: efficiency
    icon: ⚡
    description: 提升工作效率的工具和方法

# 包含文件（确保assets目录被处理）
include:
  - assets
  - CNAME
  - favicon.ico
  - ico.jpg

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - preview.html
  - preview-*.html
  - .github
  - README.md
  - SETUP.md
  - COMMENTS_SETUP.md
  - login.html
  - profile.html
  - admin
  - auth
  # 注意：categories.html 不应该被排除

# 优化配置
sass:
  style: compressed

# HTML 压缩配置已移除（jekyll-compress-html 插件不可用）
# 如需压缩 HTML，可以使用其他方法或通过构建后处理

# 缓存控制
keep_files:
  - .git
  - .gitignore

