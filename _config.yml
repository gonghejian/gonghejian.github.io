# Jekyll配置
title: "弓箭"
subtitle: "在 AI 时代，训练一种新的个人能力。"  # 副标题，显示在关于页面
description: "弓箭的个人系统入口：记录 AI 工具、知识系统、身体训练与一人公司实验。"
author: "gong"
email: ""
url: "https://gonghejian.cn"
baseurl: ""

# 语言设置
lang: zh-CN
locale: zh_CN
encoding: utf-8

# 构建设置
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
future: false  # 不发布未来日期的文章

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  # jekyll-compress-html 插件已移除（RubyGems 上不可用）

# 分页
paginate: 10
paginate_path: "/page:num/"

# 主题设置
theme: null

# 自定义集合（开发实验室 / 项目）
collections:
  projects:
    output: true
    permalink: /projects/:name/
  knowledge:
    output: true
    permalink: /knowledge/:path/

defaults:
  - scope:
      path: ""
      type: knowledge
    values:
      layout: knowledge-article
      custom_css: /assets/css/knowledge.css
      body_class: knowledge-page

# 导航菜单
navigation:
  - title: 首页
    url: /
  - title: 企业 AI
    url: /knowledge/
  - title: 文章
    url: /docs/
  - title: 白皮书
    url: /whitepaper/
  - title: 实验室
    url: /labs/
  - title: 关于
    url: /about/

# 社交媒体
# 配置说明：
# 1. 知乎：访问 https://www.zhihu.com/people/你的用户名，复制完整链接
# 2. 小红书：访问你的小红书主页，复制完整链接（格式：https://www.xiaohongshu.com/user/profile/你的ID）
# 3. 豆瓣：访问 https://www.douban.com/people/你的用户名，复制完整链接
# 4. 微信公众号：可以是公众号主页链接，或二维码图片链接
# 如果不需要某个平台，可以删除该行或留空
social:
  github: gonghejian
  twitter: ""
  email: ""
  zhihu: ""
  xiaohongshu: ""
  douban: https://www.douban.com/people/atsf/
  wechat: ""
  wechat_private: ""
  wechat_id: ""

# 评论系统配置
# 可选值: utterances, gitalk, custom
# custom: 支持匿名评论，使用 localStorage 存储（仅用于演示）
comments:
  provider: custom  # 改为 custom 启用匿名评论功能
  utterances:
    repo: yourusername/your-repo-name  # 修改为你的GitHub仓库
    issue_term: pathname
    theme: github-light

# 认证系统配置已移除

# 主页分类配置（参考少数派风格）
# 注意：slug 必须与文章中的 categories 字段匹配
home_categories:
  - name: 文章
    slug: docs
    icon: 📝
    description: 博客文章、日记和长期整理的文字
  - name: 书评
    slug: reading
    icon: 📚
    description: 豆瓣书评、读书笔记和读后感
  - name: 生活方式
    slug: lifestyle
    icon: 🌟
    description: 生活感悟、日常思考和个人成长
  - name: 效率工具
    slug: efficiency
    icon: ⚡
    description: 提升工作效率的工具和方法

# 包含文件（确保assets目录被处理）
include:
  - assets
  - CNAME
  - favicon.ico
  - ico.jpg

