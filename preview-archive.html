<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>归档 | 弓箭的博客</title>
    <meta name="description" content="记录思考、分享知识、探索世界">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="preview.html" class="site-title">弓箭的博客</a>
                <nav class="site-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="preview.html" class="nav-link">首页</a>
                        </li>
                        <li class="nav-item">
                            <a href="preview.html#categories" class="nav-link">分类</a>
                        </li>
                        <li class="nav-item">
                            <a href="preview.html#posts" class="nav-link">文章</a>
                        </li>
                        <li class="nav-item">
                            <a href="preview-about.html" class="nav-link">关于</a>
                        </li>
                        <li class="nav-item">
                            <a href="preview-archive.html" class="nav-link active">归档</a>
                        </li>
                        <li class="nav-item">
                            <a href="preview-login.html" class="nav-link" id="loginLink">登录</a>
                        </li>
                    </ul>
                </nav>
                <div class="header-right">
                    <div id="userMenu" class="user-menu" style="display: none;">
                        <img src="" alt="" class="user-avatar" style="display: none;">
                        <div class="user-dropdown">
                            <span class="user-name"></span>
                            <div class="user-dropdown-menu">
                                <a href="admin/index.html" id="adminPanelLinkMenu" class="user-dropdown-item" style="display: none;">管理面板</a>
                                <button id="logoutBtn" class="user-dropdown-item" style="display: none; border: none; background: none; width: 100%; text-align: left; cursor: pointer;">登出</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="mobile-menu-toggle" aria-label="菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="archive-page">
            <div class="container">
                <h1 class="page-title">文章归档</h1>
                
                <div class="archive-year">
                    <h2 class="archive-year-title">2024年</h2>
                    <ul class="archive-list">
                        <li class="archive-item">
                            <time datetime="2024-01-20" class="archive-date">01月20日</time>
                            <a href="preview-post.html" class="archive-link">Jekyll 入门指南</a>
                            <span class="archive-category">生活方式</span>
                        </li>
                        <li class="archive-item">
                            <time datetime="2024-01-15" class="archive-date">01月15日</time>
                            <a href="preview-post.html" class="archive-link">欢迎来到我的博客</a>
                            <span class="archive-category">生活方式</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; 2024 弓箭的博客. 保留所有权利。</p>
                    <p class="footer-description">记录思考、分享知识、探索世界</p>
                </div>
                <div class="footer-social">
                    <a href="https://github.com/yourusername" class="social-link" target="_blank" rel="noopener">
                        GitHub
                    </a>
                    <a href="https://twitter.com/yourusername" class="social-link" target="_blank" rel="noopener">
                        Twitter
                    </a>
                    <a href="mailto:your.email@example.com" class="social-link">
                        Email
                    </a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>使用 <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a> 构建，托管于 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
            </div>
        </div>
    </footer>
    
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    
    <style>
.archive-page {
    padding: var(--spacing-xl) 0;
}

.page-title {
    font-size: var(--font-size-h1);
    font-weight: 700;
    margin-bottom: var(--spacing-lg);
    color: var(--color-text);
}

.archive-year {
    margin-bottom: var(--spacing-xl);
}

.archive-year-title {
    font-size: var(--font-size-h2);
    font-weight: 600;
    margin-bottom: var(--spacing-md);
    color: var(--color-text);
    padding-bottom: var(--spacing-xs);
    border-bottom: 2px solid var(--color-border);
}

.archive-list {
    list-style: none;
    padding: 0;
}

.archive-item {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    padding: var(--spacing-sm) 0;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
}

.archive-date {
    color: var(--color-text-secondary);
    font-size: var(--font-size-small);
    min-width: 80px;
}

.archive-link {
    flex: 1;
    color: var(--color-text);
    text-decoration: none;
    font-size: var(--font-size-base);
    transition: var(--transition);
}

.archive-link:hover {
    color: var(--color-primary);
}

.archive-category {
    background: var(--color-bg-secondary);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--color-text-secondary);
}

@media (max-width: 768px) {
    .archive-item {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-xs);
    }
    
    .archive-date {
        min-width: auto;
    }
}
    </style>
</body>
</html>
