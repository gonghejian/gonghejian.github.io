<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玄学实验室 - 星盘 & 易经测算</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="mystic-app">
        <header class="app-header">
            <div class="app-header-main">
                <h1 class="app-title">玄学实验室</h1>
                <p class="app-subtitle">星盘绘制与解析 · 易经测算</p>
            </div>
        </header>

        <main class="app-main">
            <!-- 标签页切换 -->
            <div class="tabs">
                <button class="tab-button active" data-tab="astrology">星盘</button>
                <button class="tab-button" data-tab="iching">易经</button>
            </div>

            <!-- 星盘标签页 -->
            <div id="astrology-tab" class="tab-content active">
                <section class="input-section">
                    <h2 class="section-title">出生信息</h2>
                    <form id="birth-form" class="birth-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="birth-date">出生日期</label>
                                <input type="date" id="birth-date" value="1983-07-31" required>
                                <div class="calendar-toggle">
                                    <label class="toggle-label">
                                        <input type="checkbox" id="is-lunar-date">
                                        <span class="toggle-text">此为农历日期</span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="birth-time">出生时间</label>
                                <input type="time" id="birth-time" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="birth-location">出生地点</label>
                                <input type="text" id="birth-location" placeholder="例如：北京" required>
                                <small class="form-hint">输入城市名称，系统会自动获取经纬度</small>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="timezone">时区</label>
                                <select id="timezone">
                                    <option value="Asia/Shanghai">中国标准时间 (UTC+8)</option>
                                    <option value="Asia/Hong_Kong">香港时间 (UTC+8)</option>
                                    <option value="Asia/Taipei">台北时间 (UTC+8)</option>
                                    <option value="America/New_York">美国东部时间 (UTC-5)</option>
                                    <option value="America/Los_Angeles">美国西部时间 (UTC-8)</option>
                                    <option value="Europe/London">伦敦时间 (UTC+0)</option>
                                    <option value="Europe/Paris">巴黎时间 (UTC+1)</option>
                                    <option value="Asia/Tokyo">东京时间 (UTC+9)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="primary-button" id="generate-chart-btn">
                            生成星盘
                        </button>
                    </form>
                </section>

                <section class="chart-section" id="chart-section" style="display: none;">
                    <h2 class="section-title">星盘图</h2>
                    <div class="chart-container">
                        <canvas id="chart-canvas"></canvas>
                    </div>
                </section>

                <section class="interpretation-section" id="interpretation-section" style="display: none;">
                    <h2 class="section-title">星盘解析</h2>
                    <div class="interpretation-tabs">
                        <button class="interp-tab active" data-interp="planets">行星落座</button>
                        <button class="interp-tab" data-interp="houses">行星落宫</button>
                        <button class="interp-tab" data-interp="aspects">重要相位</button>
                        <button class="interp-tab" data-interp="summary">综合解读</button>
                    </div>
                    <div class="interpretation-content">
                        <div id="planets-content" class="interp-content active"></div>
                        <div id="houses-content" class="interp-content"></div>
                        <div id="aspects-content" class="interp-content"></div>
                        <div id="summary-content" class="interp-content"></div>
                    </div>
                </section>
            </div>

            <!-- 易经标签页 -->
            <div id="iching-tab" class="tab-content">
                <section class="iching-section">
                    <h2 class="section-title">易经测算</h2>
                    <p class="section-description">选择起卦方式，输入问题，获得卦象和解读</p>
                    
                    <div class="iching-methods">
                        <div class="method-tabs">
                            <button class="method-tab active" data-method="time">时间起卦</button>
                            <button class="method-tab" data-method="number">数字起卦</button>
                            <button class="method-tab" data-method="coin">手动起卦</button>
                        </div>

                        <!-- 时间起卦 -->
                        <div id="time-method" class="method-content active">
                            <form id="time-divination-form" class="divination-form">
                                <div class="form-group">
                                    <label for="divination-question">问题（可选）</label>
                                    <textarea id="divination-question" rows="3" placeholder="输入你想问的问题，例如：这次投资能否成功？"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="divination-date">起卦时间</label>
                                    <input type="datetime-local" id="divination-date" required>
                                </div>
                                <button type="submit" class="primary-button">起卦</button>
                            </form>
                        </div>

                        <!-- 数字起卦 -->
                        <div id="number-method" class="method-content">
                            <form id="number-divination-form" class="divination-form">
                                <div class="form-group">
                                    <label for="divination-question-number">问题（可选）</label>
                                    <textarea id="divination-question-number" rows="3" placeholder="输入你想问的问题"></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="number1">第一个数字</label>
                                        <input type="number" id="number1" min="1" required placeholder="输入任意数字">
                                    </div>
                                    <div class="form-group">
                                        <label for="number2">第二个数字</label>
                                        <input type="number" id="number2" min="1" required placeholder="输入任意数字">
                                    </div>
                                </div>
                                <button type="submit" class="primary-button">起卦</button>
                            </form>
                        </div>

                        <!-- 手动起卦 -->
                        <div id="coin-method" class="method-content">
                            <form id="coin-divination-form" class="divination-form">
                                <div class="form-group">
                                    <label for="divination-question-coin">问题（可选）</label>
                                    <textarea id="divination-question-coin" rows="3" placeholder="输入你想问的问题"></textarea>
                                </div>
                                <div class="form-group">
                                    <label>投掷三枚硬币（共6次，从下往上）</label>
                                    <p class="form-hint">每次投掷3枚硬币，记录正面（1）和反面（0）的数量</p>
                                    <div id="coin-throws" class="coin-throws">
                                        <!-- 动态生成投掷输入 -->
                                    </div>
                                </div>
                                <button type="submit" class="primary-button">起卦</button>
                            </form>
                        </div>
                    </div>

                    <!-- 卦象结果 -->
                    <div id="iching-result" class="iching-result" style="display: none;">
                        <h3 class="result-title">卦象结果</h3>
                        <div id="hexagram-visualization" class="hexagram-visualization"></div>
                        <div id="hexagram-interpretation" class="hexagram-interpretation"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 数据与主逻辑 -->
    <script src="./data/cities.js"></script>
    <script src="./astrology/lunar.js"></script>
    <script src="./astrology/calculator.js"></script>
    <script src="./astrology/chart.js"></script>
    <script src="./astrology/interpreter.js"></script>
    <script src="./iching/hexagrams.js"></script>
    <script src="./iching/divination.js"></script>
    <script src="./iching/interpreter.js"></script>
    <script src="./main.js"></script>
</body>
</html>
