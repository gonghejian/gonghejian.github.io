---
layout: default
---

<div class="container" style="max-width: 980px; margin: 0 auto; padding: 24px 16px;">
  <header style="margin-bottom: 16px;">
    {% if page.title %}
      <h1 style="margin: 0 0 8px 0;">{{ page.title }}</h1>
    {% endif %}
    {% if page.description %}
      <p style="margin: 0 0 12px 0; color: rgba(0,0,0,0.7);">{{ page.description }}</p>
    {% endif %}

    {% assign target_link = page.link | default: page.url %}
    {% if target_link %}
      <p style="margin: 0;">
        <a href="{{ target_link | relative_url }}">打开实验页面 →</a>
      </p>
    {% endif %}
  </header>

  <article class="project-content">
    {{ content }}
  </article>
</div>
