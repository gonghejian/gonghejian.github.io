---
layout: default
title: 个人中心
---

<div class="profile-page">
    <div class="container">
        <div class="profile-header">
            <div class="profile-avatar">
                <div class="avatar-circle" id="profileAvatar">U</div>
            </div>
            <div class="profile-info">
                <h1 class="profile-name" id="profileName">用户名</h1>
                <p class="profile-role" id="profileRole">普通用户</p>
                <p class="profile-email" id="profileEmail">user@example.com</p>
            </div>
        </div>

        <div class="profile-tabs">
            <button class="profile-tab active" data-tab="overview">概览</button>
            <button class="profile-tab" data-tab="posts">我的文章</button>
            <button class="profile-tab" data-tab="comments">我的评论</button>
            <button class="profile-tab" data-tab="settings">设置</button>
        </div>

        <!-- 概览标签页 -->
        <div class="profile-tab-content active" id="tab-overview">
            <div class="profile-stats">
                <div class="stat-card">
                    <div class="stat-value" id="myPostsCount">0</div>
                    <div class="stat-label">我的文章</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="myCommentsCount">0</div>
                    <div class="stat-label">我的评论</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="myLikesCount">0</div>
                    <div class="stat-label">获赞数</div>
                </div>
            </div>

            <div class="profile-card">
                <h3 class="profile-card-title">最近活动</h3>
                <div class="activity-list">
                    <div class="activity-item">
                        <div class="activity-icon">📝</div>
                        <div class="activity-content">
                            <p class="activity-text">发布了文章 <a href="#">Jekyll 入门指南</a></p>
                            <p class="activity-time">2 天前</p>
                        </div>
                    </div>
                    <div class="activity-item">
                        <div class="activity-icon">💬</div>
                        <div class="activity-content">
                            <p class="activity-text">评论了文章 <a href="#">欢迎来到我的博客</a></p>
                            <p class="activity-time">5 天前</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 我的文章标签页 -->
        <div class="profile-tab-content" id="tab-posts">
            <div class="profile-card">
                <div class="profile-card-header">
                    <h3 class="profile-card-title">我的文章</h3>
                    <a href="#" class="btn btn-primary">写文章</a>
                </div>
                <div class="posts-list" id="myPostsList">
                    <div class="post-item">
                        <h4 class="post-item-title"><a href="#">Jekyll 入门指南</a></h4>
                        <p class="post-item-meta">技术分享 · 2024-01-20 · 已发布</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 我的评论标签页 -->
        <div class="profile-tab-content" id="tab-comments">
            <div class="profile-card">
                <h3 class="profile-card-title">我的评论</h3>
                <div class="comments-list" id="myCommentsList">
                    <div class="comment-item">
                        <p class="comment-text">这是一条评论内容...</p>
                        <p class="comment-meta">在 <a href="#">欢迎来到我的博客</a> · 5 天前</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置标签页 -->
        <div class="profile-tab-content" id="tab-settings">
            <div class="profile-card">
                <h3 class="profile-card-title">个人设置</h3>
                <div class="settings-form">
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="nicknameInput" class="form-input" placeholder="输入昵称">
                    </div>
                    <div class="form-group">
                        <label>个人简介</label>
                        <textarea id="bioInput" class="form-input" rows="4" placeholder="介绍一下自己..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="emailInput" class="form-input" placeholder="your@email.com">
                    </div>
                    <button class="btn btn-primary" onclick="saveProfile()">保存设置</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ '/assets/js/auth.js' | relative_url }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 检查登录状态
    if (typeof auth !== 'undefined' && auth.isAuthenticated()) {
        const authData = auth.getAuth();
        if (authData) {
            document.getElementById('profileName').textContent = authData.name || authData.username;
            document.getElementById('profileRole').textContent = authData.role === 'admin' ? '管理员' : '普通用户';
            document.getElementById('profileAvatar').textContent = (authData.name || authData.username).charAt(0).toUpperCase();
        }
    } else {
        window.location.href = '/login.html';
    }

    // 标签页切换
    document.querySelectorAll('.profile-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            const tabName = this.getAttribute('data-tab');
            
            // 更新标签状态
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            
            // 更新内容显示
            document.querySelectorAll('.profile-tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
        });
    });
});

function saveProfile() {
    alert('设置已保存（演示功能）');
}
</script>
